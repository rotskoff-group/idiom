[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idiom"
version = "0.1.0"
description = "Repository for IDiom"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # core: model, tokenizer, generation, Hub loading
    "torch>=2.4",
    "numpy>=1.24",
    "safetensors>=0.4",
    "huggingface-hub>=1.10.1",
    "einops>=0.8.1",
    "loguru>=0.7",
    # training CLIs (idiom_train / idiom_grpo / idiom_sae)
    "lightning>=2.6.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "wandb>=0.18",     # pulled in by Lightning's WandbLogger, which all three trainers use
    "setuptools<81",   # lightning_fabric still imports pkg_resources, removed in setuptools 81
    # SAE feature viewer (idiom.sae.features.feature_viewer)
    "streamlit>=1.30",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src"
]

[project.optional-dependencies]
# The vendored ProtGPS reward model (rewards/protgps/) imports pytorch_lightning 1.x, which is a
# different distribution from the `lightning` 2.x the library itself uses. Only needed to run the
# protgps_* rewards: uv sync --extra protgps
protgps = [
    "pytorch-lightning>=1.9,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "pytest>=8.0",
    "pre-commit>=4.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]  # the idiom library

[tool.hatch.build.targets.wheel]
packages = ["src/idiom"]  # ship only the library

[project.scripts]
idiom_generate = "idiom.api:main"
idiom_train = "idiom.train.train:main"
idiom_grpo = "idiom.train.grpo.train_grpo:main"
idiom_sae = "idiom.sae.training.train_sae:main"
idiom_extract = "idiom.model.extract:main"
idiom_feature_dataset = "idiom.sae.features.build_feature_dataset:main"
idiom_build_store = "idiom.data.record_store:main"
