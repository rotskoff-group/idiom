[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idiom"
version = "0.1.0"
description = "Generative design of intrinsically disordered protein regions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Liu", email = "jxliu2@stanford.edu" }]

dependencies = [
    "torch>=2.4,<3",
    "numpy>=1.24",
    "safetensors>=0.4",
    "huggingface-hub>=1.10.1",
    "einops>=0.8.1",
    "loguru>=0.7",
    "lightning>=2.6.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "wandb>=0.18",
    "setuptools<81",
    "streamlit>=1.30",
    "matplotlib>=3.7",
    "logomaker>=0.8",
]

[project.urls]
Homepage = "https://github.com/rotskoff-group/idiom"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/cookbook",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*.ipynb"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
extend-select = ["D200", "D205", "D209", "D210", "D300", "D405", "D419"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"cookbook/rewards/scorers/*.py" = ["E402"]  # a scorer fixes sys.path before its own imports

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/idiom"]

[project.scripts]
idiom_generate = "idiom.api.cli:main"
idiom_train_autoreg = "idiom.train.autoreg.train_autoreg:main"
idiom_train_grpo = "idiom.train.grpo.train_grpo:main"
idiom_train_sae = "idiom.sae.train.train_sae:main"
idiom_extract = "idiom.model.extract:main"
idiom_feature_dataset = "idiom.sae.features.build_feature_dataset:main"
idiom_feature_enrichment = "idiom.sae.features.feature_enrichment:main"
idiom_build_store = "idiom.data.record_store:main"
