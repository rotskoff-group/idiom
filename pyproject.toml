[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idiom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.86",
    "einops>=0.8.1",
    "h5py>=3.15.1",
    "huggingface-hub>=1.10.1",
    "safetensors>=0.4",
    "hydra-core>=1.3.2",
    "ipdb>=0.13.13",
    "ipython>=8.38.0",
    "lightning>=2.6.0",
    "matplotlib>=3.10.9",
    "pip>=25.0",
    "pre-commit>=4.5.1",
    "scikit-learn>=1.7.2",
    "tensorboard>=2.20.0",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "tqdm>=4.67.1",
    # --- merged from idiomatics (SAE / analysis) ---
    "omegaconf>=2.3.0",
    "wandb>=0.18.0",
    "pandas>=2.2",
    "loguru>=0.7",
    "anthropic>=0.18.0",      # SAE feature annotation (P6)
    "umap-learn>=0.5.6",      # feature clustering (P6)
    "sparrow",               # IDR biophysics metrics (eval)
    "metapredict>=3",        # disorder prediction (eval)
    "streamlit>=1.39",       # SAE feature viewer (analysis/feature_viewer.py)
    "setuptools<81",
]

[tool.uv.sources]
sparrow = { git = "https://github.com/idptools/sparrow.git" }

[tool.hatch.build.targets.sdist]
include = [
    "/src"
]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# "src" -> the idiom library; "." -> top-level data_pipeline/ and analysis/ (repo-only, not shipped)
pythonpath = ["src", "."]

[tool.hatch.build.targets.wheel]
packages = ["src/idiom"]  # ship only the library; data_pipeline/ and analysis/ stay repo-only

[project.scripts]
idiom_generate = "idiom.api:main"
idiom_train = "idiom.train.train:main"
idiom_grpo = "idiom.train.grpo.train_grpo:main"
idiom_sae = "idiom.sae.train_sae:main"
idiom_extract = "idiom.model.export:main"
idiom_feature_dataset = "idiom.sae.build_feature_dataset:main"
