# Reward terms for starling.bash. Edit scorer commands, targets, shaping, and weights here
reward:
  terms:
    - label: entropy
      weight: 1.0
      reward:
        name: entropy
      shaping:
        name: quadratic
        target: 3.65
        width: 0.2
    - label: length
      weight: 1.0
      reward:
        name: length
      shaping:
        name: quadratic
        target: 100
        width: 1.0
    - label: rg_ens
      weight: 1.0
      reward:
        name: external_scorer
        cmd: env CUDA_VISIBLE_DEVICES=1 uv run --script cookbook/rewards/scorers/starling.py --property radius_of_gyration
        timeout: 900.0
        cache_max: 0
        maxlen: 0
        cwd: null
        env: null
        label: null
      shaping:
        name: quadratic
        target: 25
        width: 0.2
