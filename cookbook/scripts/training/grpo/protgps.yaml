# Reward terms for protgps.bash. Edit scorer commands, targets, shaping, and weights here
# ProtGPS is length-sensitive; add a length term if generations drift long
reward:
  terms:
    - label: entropy
      weight: 1.0
      reward:
        name: entropy
      shaping:
        name: quadratic
        target: 3.65
        width: 0.2
    - label: protgps
      weight: 1.0
      reward:
        name: external_scorer
        cmd: uv run --script cookbook/rewards/scorers/protgps.py --compartment nucleolus
        timeout: 300.0
        maxlen: 0
        cwd: null
        env: null
        cache_max: 100000
        label: null
      shaping:
        name: identity
