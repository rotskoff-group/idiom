# Override settings on the CLI:
#   idiom_train_autoreg data.train_fasta=/path/train.fasta model.n_layers=12 model.d_model=768
seed: 0
device: auto # auto | cpu | cuda
init_from: null # weights-only warm start from a .ckpt (see sft.yaml)
resume_from: null # mid-run resume (optimizer/step/LR/RNG) from a .ckpt, e.g. last.ckpt
ckpt_every_n_steps: 2000 # rolling last.ckpt cadence, for preemption-safe resume
wandb_project: idiom # WANDB_MODE=offline disables syncing
run_name: null

data:
  train_fasta: ??? # required: per-split record FASTA from curation
  val_fasta: null
  prompted_prob: 0.5 # prompted (context) vs unprompted (de novo) augmentation
  completion_only: false # pretraining: loss on every token
  batch_size: 32 # PER-GPU; global = batch_size * devices * accumulate_grad_batches
  num_workers: 8

model: # the released idiom-300M; idiom-85M = 12L/768/12, idiom-20M = 6L/512/8
  vocab_size: 27
  n_layers: 24
  d_model: 1024
  n_heads: 16
  max_seq_len: 1024 # longest protein + 4 (START + the three FIM markers)

  rope_base: 10000.0
  expansion_ratio: 2.6666666666666665
  norm_eps: 1.0e-5
  qk_norm: true
  tie_embeddings: true

optim: # paper recipe: AdamW, no weight decay, warmup 3k then cosine to 10%
  lr: 4.0e-4
  warmup_steps: 3000
  weight_decay: 0.0
  betas: [0.9, 0.95]
  min_lr_ratio: 0.1

trainer: # global batch 1024 = 32/GPU * 8 GPUs * accum 4
  max_steps: 250000
  accelerator: auto
  devices: 8
  precision: bf16-mixed
  val_check_interval: 25000
  gradient_clip_val: 0.0 # paper: no gradient clipping
  accumulate_grad_batches: 4

out_dir: ${oc.env:IDIOM_OUT,./runs}/pretrain

# IDIOM_OUT overrides the output root.
hydra:
  run:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
