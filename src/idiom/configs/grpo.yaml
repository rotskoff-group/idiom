# GRPO post-training config (flat, D6).
#   idiom_grpo init_from=/path/pretrained.ckpt reward.name=protgps prompts.mode=idp
seed: 0
device: auto
init_from: ???               # required: pretrained checkpoint to optimize
resume_from: null            # mid-run resume (optimizer/step/RNG) from a .ckpt

prompts:
  mode: idp                  # idp ("132", de-novo) | record (per-protein flank prompts)
  n: 1000                    # idp: number of prompts
  fasta: null                # record mode: FASTA of proteins (_IDR_x-y headers)
  n_per: 1000                # record mode: copies per protein
  batch_size: 4              # distinct prompts per micro-batch (each -> group_size completions); effective prompts/optimizer-step = batch_size * trainer.accumulate_grad_batches

grpo:
  group_size: 8
  max_new_tokens: 1020
  lr: 5.0e-6
  beta_kl: 0.02
  eps_clip: 0.2
  temperature: 1.0
  top_k: null
  top_p: null
  normalize_advantage: true
  log_samples_every: 5         # print N example generations every K steps (0 disables)
  n_log_samples: 3

reward:                      # base reward + optional shaping/length/entropy (sweep-tuned defaults)
  module: null               # optional: a *.py / module with @register_reward, imported first
                             #   (e.g. rewards/example_rewards.py — copy/edit for your own)
  name: fraction_proline     # any registered reward, or 'protgps' (operator-registered)
  monitor: null              # optional registered reward: LOGGED (train/reward_monitor) but NOT optimized
  shaping: {enabled: false, target: 0.9, scale: 1.0}
  length:  {enabled: true, target_length: 100, width: 1.0, weight: 1.0}
  entropy: {enabled: true, target_entropy: 3.68, width: 0.2, weight: 1.0}  # bits (= 2.55 nats); corpus IDR mean ~3.64 bits

trainer:
  max_steps: 1500
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2  # accumulate N micro-batches per optimizer step (halves peak memory vs. one big batch)
  log_every_n_steps: 10    # W&B metric flush cadence (train/reward, reward_monitor, kl, ...); Lightning default is 50
  checkpoint_every: 500    # save a periodic checkpoint every N optimizer steps (0 = last only)

out_dir: ${oc.env:IDIOM_OUT,/data2/scratch/group_scratch/idr_plm/2026-06-14_refactor/runs}/grpo

# Hydra run/sweep dir -> experiment dir (keeps the repo clean); override via IDIOM_OUT.
hydra:
  run:
    dir: ${oc.env:IDIOM_OUT,/data2/scratch/group_scratch/idr_plm/2026-06-14_refactor}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:IDIOM_OUT,/data2/scratch/group_scratch/idr_plm/2026-06-14_refactor}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
