# GRPO post-training config.
#   idiom_grpo init_from=jxliu2/idiom-20M reward.rl_sae.enabled=true prompts.mode=unprompted
seed: 0
device: auto
init_from: ???               # required: base to optimize (a .ckpt, a released dir, or a HF repo id e.g. jxliu2/idiom-20M)
resume_from: null            # mid-run resume (optimizer/step/RNG) from a .ckpt

prompts:
  mode: unprompted           # unprompted ("132", de novo) | prompted (per-protein flank prompts)
  n: 1000                    # unprompted mode: number of prompts
  fasta: null                # record mode: FASTA of proteins (_IDR_x-y headers)
  n_per: 1000                # record mode: copies per protein
  batch_size: 4              # distinct prompts per micro-batch (each -> group_size completions); effective prompts/optimizer-step = batch_size * trainer.accumulate_grad_batches

grpo:
  group_size: 8
  max_new_tokens: 1020
  lr: 5.0e-6
  beta_kl: 0.02
  eps_clip: 0.2
  temperature: 1.0
  top_k: null
  top_p: null
  normalize_advantage: true
  log_samples_every: 5         # print N example generations every K steps (0 disables)
  n_log_samples: 3

reward:                      # total = sum of the enabled terms, each scaled by its weight
  module: null               # optional: a *.py / module with @register_reward, imported first
                             #   (e.g. rewards/example_rewards.py — copy/edit for your own)
  
  entropy: {enabled: true,  weight: 1.0, target_entropy: 3.65, width: 0.2} # entropy in bits
  length:  {enabled: true,  weight: 1.0, target_length: 100, width: 1.0} # length in residues
  
  rl_sae:  {enabled: false, weight: 1.0, signature: nucleolus} 
  # reproduce a target SAE feature code (targets in rewards/rl_sae_targets/)

  external: []
  # external: bring-your-own reward models; each entry is one of:
  # in-process (a registered reward): {enabled, weight, name: aromatic_fraction, module: rewards/example_rewards.py}
  # subprocess (own env, built on demand by uv -- set UV_CACHE_DIR to scratch):
  # {enabled, weight, target, width, cmd: "uv run --isolated --no-project --with 'sparrow @ git+https://github.com/idptools/sparrow.git' python rewards/external_scorers/sparrow.py --property radius_of_gyration"}
  # a subprocess scorer returns a raw value; target/width shape it with a quadratic penalty toward target (like entropy/length). monitor: true logs an entry without adding it to the total.

trainer:
  max_steps: 3000
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2  # accumulate N micro-batches per optimizer step (halves peak memory vs. one big batch)
  log_every_n_steps: 1     # log EVERY step so W&B's native _step axis == the real training step (0..max_steps)
  checkpoint_every: 0    # save a periodic checkpoint every N optimizer steps (0 = last only)

out_dir: ${oc.env:IDIOM_OUT,./runs}/grpo

# Hydra run/sweep dir -> experiment dir (keeps the repo clean); override via IDIOM_OUT.
hydra:
  run:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
