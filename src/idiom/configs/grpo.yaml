# GRPO post-training config.
#   idiom_grpo init_from=jxliu2/idiom-20M prompts.mode=unprompted
seed: 0
device: auto
init_from: ??? # required: base to optimize (a .ckpt, a released dir, or a HF repo id)
resume_from: null # mid-run resume (optimizer/step/RNG) from a .ckpt

prompts:
  mode: unprompted # unprompted (de novo) | prompted (per-protein flank prompts)
  n: 1000 # unprompted mode: number of prompts
  fasta: null # prompted mode: FASTA of proteins (_IDR_x-y headers)
  n_per: 1000 # prompted mode: copies per protein
  batch_size: 4 # prompts per micro-batch; each expands to group_size completions

grpo:
  group_size: 8
  max_new_tokens: 1020
  lr: 5.0e-6
  beta_kl: 0.02
  eps_clip: 0.2
  temperature: 1.0
  top_k: null
  top_p: null
  normalize_advantage: true
  log_samples_every: 5 # print example generations every N steps (0 disables)
  n_log_samples: 3

trainer:
  max_steps: 3000
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2 # micro-batches per optimizer step; halves peak memory
  log_every_n_steps: 1 # every step, so W&B's _step axis matches the training step
  checkpoint_every: 0 # periodic checkpoint every N steps (0 = last only)

reward: # total = sum over enabled terms of weight * shaping(reward(idr))
  module: null # optional *.py or module with @register_reward, imported first

  terms:
    - enabled: true
      reward: entropy
      weight: 1.0
      module: ${idiom_rewards:custom_rewards.py}
      shaping: {type: quadratic, target: 3.65, width: 0.2} # bits

    - enabled: true
      reward: length
      weight: 1.0
      module: ${idiom_rewards:custom_rewards.py}
      shaping: {type: quadratic, target: 100, width: 1.0} # residues

    # Reproduce a target's SAE feature code; the signature ships beside the reward.
    - enabled: false
      reward: sae_only_nucleolus
      weight: 1.0
      module: ${idiom_rewards:rl_sae_reward/rl_sae_reward.py}
      shaping: null

    # Your own in-process reward: register f(idr) -> float and name it here.
    - enabled: false
      reward: net_charge_fraction
      weight: 1.0
      module: ${idiom_rewards:custom_rewards.py}
      shaping: {type: gaussian, target: 0.25, width: 0.5}

    # Your own reward model in its own environment; its deps live in the scorer script (PEP 723).
    # Point UV_CACHE_DIR at scratch -- an on-demand env is several GB.
    - enabled: false
      cmd: "uv run --script ${idiom_rewards:external_rewards/sparrow.py} --property radius_of_gyration"
      label: rg
      weight: 0.5
      shaping: {type: quadratic, target: 25, width: 0.2}
      timeout: 300.0 # seconds to wait for one response
      maxlen: 0 # truncate sequences to this length before sending; 0 sends them whole
      cwd: null # working directory for the child; the current directory if null

    # The other shipped scorers, each self-contained: the PEP 723 header is the environment and any
    # weights are fetched on first use. See the reward section of the top-level README.md.

    # Interaction chemistry: epsilon < 0 is attractive (FUS-LC-like is about -8.5, IDiom's base
    # generations +3.3), so a negative target designs self-attractive, condensate-prone IDRs.
    - enabled: false
      cmd: "uv run --script ${idiom_rewards:external_rewards/finches.py} --mode homotypic"
      label: eps
      weight: 1.0
      shaping: {type: quadratic, target: -6.0, width: 0.3}

    # Condensate compartment probability from ProtGPS (ESM-2). Already in [0, 1], so no shaping.
    - enabled: false
      cmd: "uv run --script ${idiom_rewards:external_rewards/protgps.py} --compartment nucleolus"
      label: protgps
      weight: 1.0

    # Transcriptional activation strength (PADDLE, max Z over 53-residue windows). Natural
    # activation domains score about 3-8, IDiom's base generations near 0; the Z-scale needs no
    # shaping if you simply want it as high as possible.
    - enabled: false
      cmd: "uv run --script ${idiom_rewards:external_rewards/paddle.py}"
      label: paddle
      weight: 1.0
      timeout: 600.0

    # Phase-separation thermodynamics (PSpred): transfer free energy in kT, trained on CALVADOS
    # simulations. LAF1 scores about -6 kT and poly-GS about +0.3, so a negative target designs
    # sequences that phase-separate readily. --target logcdil_mgml gives saturation concentration.
    - enabled: false
      cmd: "uv run --script ${idiom_rewards:external_rewards/pspred.py} --target dG"
      label: dG
      weight: 1.0
      shaping: {type: quadratic, target: -6.0, width: 0.3}

    # Ensemble dimensions from a STARLING-generated conformational ensemble: the same quantity
    # sparrow regresses, sampled instead. About 9 s per step on a GPU, so give it a long timeout.
    - enabled: false
      cmd: "uv run --script ${idiom_rewards:external_rewards/starling.py} --property radius_of_gyration"
      label: rg_ens
      weight: 1.0
      shaping: {type: quadratic, target: 25, width: 0.2}
      timeout: 900.0

out_dir: ${oc.env:IDIOM_OUT,./runs}/grpo

# Run and sweep dirs go to the experiment dir, not the repo; override with IDIOM_OUT.
hydra:
  run:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
