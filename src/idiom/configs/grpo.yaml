# GRPO post-training config
seed: 0
device: auto
init_from: ??? # required: model to optimize (a .ckpt, a released dir, or a HF repo id)
resume_from: null # mid-run resume (optimizer/step/RNG) from a .ckpt

prompts:
  mode: unprompted # unprompted (de novo) | prompted (per-protein flank prompts)
  n: 1000 # unprompted mode: number of prompts
  fasta: null # prompted mode: FASTA of proteins (_IDR_x-y headers)
  n_per: 1000 # prompted mode: copies per protein
  batch_size: 4 # prompts per micro-batch, each prompt yields group_size completions

grpo:
  group_size: 8
  max_new_tokens: 1020
  lr: 5.0e-6
  beta_kl: 0.02
  eps_clip: 0.2
  temperature: 1.0
  top_k: null
  top_p: null
  normalize_advantage: true # normalize by std dev
  log_samples_every: 5 # print example generations every N steps (0 disables)
  n_log_samples: 3

trainer:
  max_steps: 3000
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2 # micro-batches per optimizer step
  log_every_n_steps: 1 # every step, so W&B's _step axis matches the training step
  checkpoint_every: 0 # periodic checkpoint every N steps (0 = last only)

reward: # total = sum over terms of weight * shaping(reward(idr))
  # Empty on purpose: a run names every term it optimizes. A term is a reward, a shaping, a weight
  # and a label; reward and shaping are each a name plus that factory's arguments. Shipped reward
  # names: entropy, length, scorer, sae_signature. Shipped shaping: quadratic, gaussian, identity.
  # Anything else is a "module:function" path. See cookbook/scripts/grpo/ for a script per objective.
  #
  #   reward.terms='[{reward: entropy, shaping: {name: quadratic, target: 3.65, width: 0.2}, weight: 1.0}]'
  terms: []

out_dir: ${oc.env:IDIOM_OUT,./runs}/grpo

hydra:
  run:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
