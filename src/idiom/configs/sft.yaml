# SFT config (flat, D6). Same module as pretraining; differs by completion-only loss + warm start.
#   idiom_train --config-name sft init_from=/path/pretrained.ckpt data.train_fasta=/path/sft.fasta
seed: 0
device: auto
init_from: ???               # required: the pretrained checkpoint to fine-tune

data:
  train_fasta: ???           # required: the (usually small, curated) SFT record FASTA
  val_fasta: null
  fim_full_prob: 1.0         # SFT is typically full-context in-filling
  completion_only: true      # train loss on the IDR completion only
  batch_size: 32
  num_workers: 8

model:                       # MUST match the pretrained checkpoint's architecture
  n_layers: 24
  d_model: 1024
  n_heads: 16
  max_seq_len: 1024

optim:
  lr: 1.0e-5                 # gentle, to not wash out pretraining
  warmup_steps: 100
  weight_decay: 0.1
  min_lr_ratio: 0.1

trainer:
  max_steps: 2000
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0

out_dir: ${oc.env:IDIOM_OUT,./runs}/sft
