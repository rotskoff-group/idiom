# SFT uses pretrained weights and completion-only loss
#   idiom_train_autoreg --config-name sft init_from=jxliu2/idiom-20M data.train_fasta=/path/sft.fasta
seed: 0
device: auto
init_from: ??? # Checkpoint, release directory, or Hub repo ID
resume_from: null # Resume training state (optimizer, step, LR, RNG) from a .ckpt
ckpt_every_n_steps: 2000 # Steps between rolling last.ckpt saves
wandb_project: idiom # WANDB_MODE=offline disables syncing
run_name: null

data:
  train_fasta: ??? # Required: curated training records in record FASTA format
  val_fasta: null
  prompted_prob: 1.0 # Probability of prompted input; 1.0 uses context infilling only
  completion_only: true # loss on the IDR completion only
  batch_size: 32
  num_workers: 8

# Model architecture is loaded from init_from

optim:
  lr: 1.0e-5
  warmup_steps: 100
  weight_decay: 0.1
  betas: [0.9, 0.95]
  min_lr_ratio: 0.1

trainer:
  max_steps: 2000
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0

out_dir: ${oc.env:IDIOM_OUT,./runs}/sft

# IDIOM_OUT overrides the output root
hydra:
  run:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:IDIOM_OUT,.}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
