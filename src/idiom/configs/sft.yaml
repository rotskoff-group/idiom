# SFT config (flat, D6). Same module as pretraining; differs by completion-only loss + warm start.
#   idiom_train --config-name sft init_from=/path/pretrained.ckpt data.train_fasta=/path/sft.fasta
seed: 0
device: auto
init_from: ???               # required: the pretrained checkpoint to fine-tune (weights-only warm start)
resume_from: null            # true mid-run resume (optimizer/step/LR/RNG) from a .ckpt, e.g. last.ckpt
wandb_project: idiom         # wandb project (needs `wandb login` / WANDB_API_KEY; WANDB_MODE=offline to disable)
run_name: null               # optional wandb run name

data:
  train_fasta: ???           # required: the (usually small, curated) SFT record FASTA
  val_fasta: null
  fim_full_prob: 1.0         # SFT is typically full-context in-filling
  completion_only: true      # train loss on the IDR completion only
  batch_size: 32
  num_workers: 8

# (no `model:` block — SFT warm-starts from init_from, whose architecture is read from the checkpoint)

optim:
  lr: 1.0e-5                 # gentle, to not wash out pretraining
  warmup_steps: 100
  weight_decay: 0.1
  min_lr_ratio: 0.1

trainer:
  max_steps: 2000
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0

out_dir: ${oc.env:IDIOM_OUT,/data2/scratch/group_scratch/idr_plm/2026-06-14_refactor/runs}/sft

# Hydra run/sweep dir -> experiment dir (keeps the repo clean); override via IDIOM_OUT.
hydra:
  run:
    dir: ${oc.env:IDIOM_OUT,/data2/scratch/group_scratch/idr_plm/2026-06-14_refactor}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:IDIOM_OUT,/data2/scratch/group_scratch/idr_plm/2026-06-14_refactor}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
